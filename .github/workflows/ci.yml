name: CI
on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.14"

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --locked pytest -v

