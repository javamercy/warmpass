[project]
name = "warmpass"
version = "0.1.0"
description = "Run and schedule coding agent warmups to start usage windows early."
readme = "README.md"
authors = [{ name = "Emre Kurşun" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "agents", "claude", "antigravity", "codex", "scheduler"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.14"
dependencies = [
    "platformdirs>=4.14.3",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/javamercy/warmpass"
Repository = "https://github.com/javamercy/warmpass"
Issues = "https://github.com/javamercy/warmpass/issues"

[project.scripts]
warmpass = "warmpass.cli.main:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

# Pyrefly
[tool.pyrefly]
preset = "strict"
project-includes = ["**/*.py"]
search-path = ["src", "."]

[tool.pyrefly.errors]
unannotated-return = "error"
no-any-return = "error"

# Ruff
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
    "RUF100", # Unused noqa directives
]

ignore = [
    "E501", # Leave line wrapping to the formatter
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]
