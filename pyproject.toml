[project]
name = "warmpass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "platformdirs>=4.14.3",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
warmpass = "warmpass.cli.main:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Mirrored layout repeats basenames (test_scheduler.py, test_plist.py).
addopts = ["--import-mode=importlib"]
# Lets tests import the shared fakes as `tests.support.fakes`.
pythonpath = ["."]

# Pyrefly
[tool.pyrefly]
preset = "strict"
project-includes = ["**/*.py"]
search-path = ["src", "."]

[tool.pyrefly.errors]
unannotated-return = "error"
no-any-return = "error"

# Ruff
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
    "RUF100", # Unused noqa directives
]

ignore = [
    "E501", # Leave line wrapping to the formatter
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]
